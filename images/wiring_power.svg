<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Power diagram: LiPo red to TP4056 B+, black to B-. TP4056 OUT+ to the switch's middle pin, switch outer pin to C3 5V. TP4056 OUT- to C3 GND."><style>text{font-family:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}.d-module{fill:#E3EAF4;stroke:#1F3A63;stroke-width:1.5}.d-module-label{fill:#1F3A63;font-size:12px}.d-mcu{fill:#22262A}.d-mcu-pin{fill:#E8EBEE;font-size:12px;font-weight:600}.d-mcu-pin.unused{opacity:0.45;font-weight:400}.d-mcu-label{fill:#E8EBEE;font-size:12px}.d-metal{fill:#A9B0B7}.d-screen{fill:#0B0D10}.d-pin-label{fill:#1F3A63;font-size:12px;font-weight:600}.d-pad{fill:#B0682B}.d-note{fill:#59655E;font-size:11px}.d-wire{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.d-tag-text{fill:#FFFFFF;font-size:11px;font-weight:600}.d-lipo{fill:#A9B0B7;opacity:0.55;stroke:#59655E;stroke-width:1.2}.d-ink{fill:#16201B;font-size:12px}.s-block{fill:#FFFFFF;stroke:#16201B;stroke-width:1.5}.s-inner{fill:none;stroke:#59655E;stroke-width:1.2;stroke-dasharray:4 3}.s-line{fill:none;stroke:#16201B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.s-line-pwr{stroke:#D42A2A}.s-text{fill:#16201B;font-size:12px}.s-title{fill:#16201B;font-size:13px;font-weight:600}.s-muted{fill:#59655E;font-size:10.5px}.s-pin{fill:#16201B;font-size:11px;font-weight:600}.s-3v3{fill:#D42A2A;font-size:11px;font-weight:600}</style><rect width="100%" height="100%" fill="#ffffff"/>
          <rect class="d-lipo" x="20" y="70" width="170" height="100" rx="10"/>
          <text class="d-ink" x="105" y="112" text-anchor="middle" font-weight="600">LiPo 3.7 V</text>
          <text class="d-ink" x="105" y="130" text-anchor="middle">600 mAh</text>
          <text class="d-note" x="105" y="148" text-anchor="middle">523040 pouch</text>

          <rect class="d-metal" x="395" y="40" width="60" height="22" rx="7"/>
          <text class="d-note" x="425" y="30" text-anchor="middle">charge here (USB-C)</text>
          <rect class="d-module" x="330" y="56" width="190" height="128" rx="8"/>
          <text class="d-module-label" x="425" y="164" text-anchor="middle" font-weight="600">TP4056 charger</text>
          <text class="d-pin-label" x="342" y="104">B+</text>
          <text class="d-pin-label" x="342" y="144">B−</text>
          <text class="d-pin-label" x="508" y="104" text-anchor="end">OUT+</text>
          <text class="d-pin-label" x="508" y="144" text-anchor="end">OUT−</text>

          <path class="d-wire" stroke="#D42A2A" d="M190 100 H330"/>
          <path class="d-wire" stroke="#16201B" d="M190 140 H330"/>
          <text class="d-note" x="260" y="92" text-anchor="middle">red</text>
          <text class="d-note" x="260" y="160" text-anchor="middle">black</text>

          <!-- switch -->
          <path class="d-wire" stroke="#B4590A" d="M520 100 H620"/>
          <path class="d-wire" stroke="#B4590A" d="M620 100 L684 84"/>
          <circle cx="620" cy="100" r="5" fill="#16201B"/>
          <circle cx="690" cy="84" r="5" fill="none" stroke="#16201B" stroke-width="2"/>
          <circle cx="690" cy="116" r="5" fill="none" stroke="#16201B" stroke-width="2"/>
          <text class="d-note" x="655" y="64" text-anchor="middle">slide switch</text>
          <text class="d-note" x="604" y="90" text-anchor="end">middle</text>
          <text class="d-note" x="700" y="128">unused</text>
          <path class="d-wire" stroke="#B4590A" d="M695 84 H760"/>
          <rect x="760" y="75" width="70" height="18" rx="4" fill="#B4590A"/>
          <text class="d-tag-text" x="795" y="88" text-anchor="middle">C3 5V</text>

          <path class="d-wire" stroke="#16201B" d="M520 140 H760"/>
          <rect x="760" y="131" width="70" height="18" rx="4" fill="#16201B"/>
          <text class="d-tag-text" x="795" y="144" text-anchor="middle">C3 GND</text>

          <g class="d-pad">
            <circle cx="330" cy="100" r="5"/><circle cx="330" cy="140" r="5"/><circle cx="520" cy="100" r="5"/><circle cx="520" cy="140" r="5"/>
          </g>
        </svg>
